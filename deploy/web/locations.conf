# Included in the server block of upstream's template (apps/web/docker/nginx-templates),
# next to privacy.conf, which 40-render-config.sh writes at every start.

location ^~ /brand/ {
    alias /brand/;
    add_header Cache-Control "no-cache";
}

# 50-apply-brand.sh rewrites these at every start.
location = /manifest.json {
    add_header Cache-Control "no-cache";
}
location ^~ /vector-icons/ {
    add_header Cache-Control "no-cache";
}
location ^~ /themes/element/img/logos/ {
    add_header Cache-Control "no-cache";
}
